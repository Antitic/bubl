name: Bubl

options:
  bundleIdPrefix: com.tikawski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.0

targets:
  Bubl:
    type: application
    platform: iOS
    sources:
      - path: BublApp
      - path: Shared
      # Keyboard views are also compiled into the app for the screenshot demo mode.
      - path: BublKeyboard/KeyboardLayout.swift
      - path: BublKeyboard/KeyboardView.swift
      - path: BublKeyboard/TopBarView.swift
      - path: BublKeyboard/SpellEngine.swift
      - path: BublKeyboard/DictationClient.swift
    dependencies:
      - target: BublKeyboard
      - package: WhisperKit
        product: WhisperKit
    info:
      path: BublApp/Info.plist
      properties:
        CFBundleDisplayName: Bubl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Bubl utilise le micro pour transcrire ta voix en texte, entièrement sur l'iPhone."
        CFBundleURLTypes:
          - CFBundleURLName: com.tikawski.bubl
            CFBundleURLSchemes: [bubl]
    entitlements:
      path: BublApp/Bubl.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tikawski.bubl]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tikawski.bubl
        PRODUCT_NAME: Bubl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BublKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: BublKeyboard
      - path: Shared
    info:
      path: BublKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Bubl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: fr-FR
            RequestsOpenAccess: true
    entitlements:
      path: BublKeyboard/BublKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tikawski.bubl]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tikawski.bubl.keyboard
        PRODUCT_NAME: BublKeyboard

schemes:
  Bubl:
    build:
      targets:
        Bubl: all
        BublKeyboard: all
