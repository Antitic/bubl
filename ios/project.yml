name: Murmure

options:
  bundleIdPrefix: com.tikawski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.0

targets:
  Murmure:
    type: application
    platform: iOS
    sources:
      - path: MurmureApp
      - path: Shared
      # Keyboard views are also compiled into the app for the screenshot demo mode.
      - path: MurmureKeyboard/KeyboardLayout.swift
      - path: MurmureKeyboard/KeyboardView.swift
      - path: MurmureKeyboard/TopBarView.swift
      - path: MurmureKeyboard/SpellEngine.swift
      - path: MurmureKeyboard/DictationClient.swift
    dependencies:
      - target: MurmureKeyboard
      - package: WhisperKit
        product: WhisperKit
    info:
      path: MurmureApp/Info.plist
      properties:
        CFBundleDisplayName: Murmure
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Murmure utilise le micro pour transcrire ta voix en texte, entièrement sur l'iPhone."
        CFBundleURLTypes:
          - CFBundleURLName: com.tikawski.murmure
            CFBundleURLSchemes: [murmure]
    entitlements:
      path: MurmureApp/Murmure.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tikawski.murmure]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tikawski.murmure
        PRODUCT_NAME: Murmure
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MurmureKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: MurmureKeyboard
      - path: Shared
    info:
      path: MurmureKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Murmure
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: fr-FR
            RequestsOpenAccess: true
    entitlements:
      path: MurmureKeyboard/MurmureKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tikawski.murmure]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tikawski.murmure.keyboard
        PRODUCT_NAME: MurmureKeyboard

schemes:
  Murmure:
    build:
      targets:
        Murmure: all
        MurmureKeyboard: all
